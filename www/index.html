<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a1018">
  <title>Neon District // Drive</title>
  <style>
    :root {
      color-scheme: dark;
      --cyan: #66e8ff;
      --amber: #ffb347;
      --panel: rgba(8, 14, 24, .78);
      --line: rgba(151, 219, 239, .28);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #070b12; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; touch-action: none; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; user-select: none; }
    .panel { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 8px 30px rgba(0,0,0,.28); backdrop-filter: blur(12px); }
    #brand { position: absolute; top: max(18px, env(safe-area-inset-top)); left: max(18px, env(safe-area-inset-left)); padding: 12px 15px; border-left: 3px solid var(--cyan); }
    #brand strong { display: block; color: var(--cyan); font-size: 13px; letter-spacing: .2em; }
    #brand span { color: rgba(232,246,255,.65); font-size: 10px; letter-spacing: .16em; }
    #telemetry { position: absolute; top: max(18px, env(safe-area-inset-top)); right: max(18px, env(safe-area-inset-right)); min-width: 106px; padding: 10px 13px; text-align: right; }
    #speed { color: #fff; font-size: 27px; line-height: 1; font-variant-numeric: tabular-nums; }
    #speed small { color: var(--cyan); font-size: 10px; letter-spacing: .18em; }
    #status { margin-top: 6px; color: var(--amber); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
    #hint { position: absolute; left: 50%; bottom: max(19px, env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 8px 12px; color: rgba(235,248,255,.7); font-size: 10px; letter-spacing: .12em; white-space: nowrap; }
    #joystick-zone { position: fixed; left: max(22px, env(safe-area-inset-left)); bottom: max(26px, env(safe-area-inset-bottom)); width: 146px; height: 146px; pointer-events: auto; }
    #joystick-base { position: absolute; inset: 10px; border: 1px solid rgba(150,229,255,.45); border-radius: 50%; background: radial-gradient(circle, rgba(93,198,232,.12), rgba(14,28,42,.42)); box-shadow: inset 0 0 20px rgba(88,220,255,.08); }
    #joystick-base::before, #joystick-base::after { content: ""; position: absolute; background: rgba(145,226,247,.17); }
    #joystick-base::before { width: 1px; height: 100%; left: 50%; top: 0; }
    #joystick-base::after { width: 100%; height: 1px; left: 0; top: 50%; }
    #joystick-knob { position: absolute; left: 50%; top: 50%; width: 57px; height: 57px; border: 2px solid var(--cyan); border-radius: 50%; transform: translate(-50%, -50%); background: rgba(85,207,238,.24); box-shadow: 0 0 20px rgba(80,222,255,.36); transition: transform .08s ease-out; }
    #buttons { position: fixed; right: max(22px, env(safe-area-inset-right)); bottom: max(26px, env(safe-area-inset-bottom)); display: flex; align-items: end; gap: 13px; pointer-events: auto; }
    .drive-button { width: 80px; height: 80px; border: 1px solid rgba(255,255,255,.34); border-radius: 50%; color: white; font: 800 11px/1 inherit; letter-spacing: .12em; background: rgba(16,27,40,.75); box-shadow: inset 0 0 22px rgba(255,255,255,.05); -webkit-tap-highlight-color: transparent; }
    .drive-button:active, .drive-button.active { transform: scale(.94); background: rgba(80,202,232,.35); border-color: var(--cyan); }
    #brake { width: 62px; height: 62px; color: #ffc2a8; border-color: rgba(255,155,126,.5); }
    #damage { position: absolute; left: 50%; top: 19%; transform: translateX(-50%); color: #ffd2a3; font-size: 10px; letter-spacing: .2em; opacity: 0; transition: opacity .2s; }
    @media (min-width: 700px) {
      #joystick-zone { left: 30px; bottom: 30px; }
      #buttons { right: 30px; bottom: 30px; }
      #hint { bottom: 24px; }
    }
    @media (max-height: 500px) {
      #joystick-zone { transform: scale(.78); transform-origin: bottom left; }
      #buttons { transform: scale(.78); transform-origin: bottom right; }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Neon District driving game"></canvas>
  <div id="hud">
    <div id="brand" class="panel"><strong>NEON DISTRICT</strong><span>OPEN CITY / PROTOTYPE</span></div>
    <div id="telemetry" class="panel"><div id="speed">000 <small>KM/H</small></div><div id="status">cruise ready</div></div>
    <div id="damage">VEHICLE IMPACT</div>
    <div id="hint" class="panel">DRAG TO STEER &nbsp;|&nbsp; HOLD GAS TO ACCELERATE</div>
  </div>
  <div id="joystick-zone" aria-label="Steering joystick">
    <div id="joystick-base"></div>
    <div id="joystick-knob"></div>
  </div>
  <div id="buttons" aria-label="Driving controls">
    <button id="brake" class="drive-button" type="button">BRAKE</button>
    <button id="gas" class="drive-button" type="button">GAS</button>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const canvas = document.getElementById("game");
    const speedReadout = document.getElementById("speed");
    const statusReadout = document.getElementById("status");
    const damageReadout = document.getElementById("damage");
    const joystickZone = document.getElementById("joystick-zone");
    const joystickKnob = document.getElementById("joystick-knob");
    const gasButton = document.getElementById("gas");
    const brakeButton = document.getElementById("brake");

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0c1620, 0.0048);
    const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 900);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
    renderer.setSize(innerWidth, innerHeight, false);
    const compactDevice = matchMedia("(pointer: coarse)").matches || Math.min(innerWidth, innerHeight) < 700;
    renderer.shadowMap.enabled = !compactDevice;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.setClearColor(0x071019, 1);

    const clock = new THREE.Clock();
    const city = new THREE.Group();
    const actors = new THREE.Group();
    scene.add(city, actors);
    const colliders = [];
    const lamps = [];
    const input = { throttle: 0, brake: 0, steer: 0 };
    const keys = new Set();
    const state = { speed: 0, heading: 0, health: 100, elapsed: 0, impactTimer: 0 };
    const car = new THREE.Group();
    actors.add(car);
    const carPosition = new THREE.Vector3(0, 0, 0);
    const cameraTarget = new THREE.Vector3();
    const cameraPosition = new THREE.Vector3();

    const palettes = {
      road: new THREE.MeshStandardMaterial({ color: 0x111a22, roughness: 0.9, metalness: 0.05 }),
      curb: new THREE.MeshStandardMaterial({ color: 0x4b5660, roughness: 0.8 }),
      sidewalk: new THREE.MeshStandardMaterial({ color: 0x293742, roughness: 1 }),
      building: [0x344b60, 0x40566b, 0x574d68, 0x2b5260, 0x4e5a65],
      window: new THREE.MeshBasicMaterial({ color: 0xffbd66, toneMapped: false }),
      tree: new THREE.MeshStandardMaterial({ color: 0x1b6b5d, roughness: 1 }),
      trunk: new THREE.MeshStandardMaterial({ color: 0x5b4035, roughness: 1 })
    };
    const windowGeometry = new THREE.PlaneGeometry(1.35, 1.45);
    const windowBatches = {
      warm: new THREE.InstancedMesh(windowGeometry, new THREE.MeshBasicMaterial({ color: 0xffbd66, toneMapped: false, side: THREE.DoubleSide }), 6000),
      cool: new THREE.InstancedMesh(windowGeometry, new THREE.MeshBasicMaterial({ color: 0x9ef0ff, toneMapped: false, side: THREE.DoubleSide }), 6000)
    };
    const windowDummy = new THREE.Object3D();
    for (const batch of Object.values(windowBatches)) {
      batch.count = 0;
      batch.frustumCulled = false;
      city.add(batch);
    }

    const skyMaterial = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: { uTime: { value: 0 } },
      vertexShader: `varying vec3 vDirection; void main() { vDirection = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `varying vec3 vDirection; uniform float uTime; void main() { vec3 d = normalize(vDirection); float h = clamp(d.y * .5 + .5, 0.0, 1.0); vec3 horizon = vec3(.04, .09, .15); vec3 zenith = vec3(.005, .015, .045); vec3 color = mix(horizon, zenith, smoothstep(.15, .95, h)); vec2 sun = normalize(vec2(.7, .45)); float glow = pow(max(dot(normalize(d.xz), sun), 0.0), 34.0) * .32 * smoothstep(-.1, .4, d.y); color += vec3(1.0, .42, .18) * glow; color += vec3(.02, .08, .12) * (sin(uTime * .04) * .5 + .5); gl_FragColor = vec4(color, 1.0); }`
    });
    const sky = new THREE.Mesh(new THREE.SphereGeometry(700, 24, 16), skyMaterial);
    scene.add(sky);

    const sun = new THREE.DirectionalLight(0xffd1a2, 2.0);
    sun.position.set(-120, 180, 80);
    sun.castShadow = renderer.shadowMap.enabled;
    sun.shadow.mapSize.set(compactDevice ? 512 : 1024, compactDevice ? 512 : 1024);
    sun.shadow.camera.left = -240;
    sun.shadow.camera.right = 240;
    sun.shadow.camera.top = 240;
    sun.shadow.camera.bottom = -240;
    sun.shadow.bias = -0.0003;
    scene.add(sun);
    scene.add(new THREE.HemisphereLight(0x78b7d3, 0x101820, 1.8));

    const groundMaterial = new THREE.ShaderMaterial({
      uniforms: { uRoad: { value: new THREE.Color(0x121b23) }, uGrid: { value: new THREE.Color(0x1d303a) } },
      vertexShader: `varying vec2 vUv; void main() { vUv = uv * 34.0; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `varying vec2 vUv; uniform vec3 uRoad; uniform vec3 uGrid; void main() { vec2 distanceToLine = abs(fract(vUv) - .5); float grid = 1.0 - smoothstep(.44, .5, max(distanceToLine.x, distanceToLine.y)); vec3 color = mix(uRoad, uGrid, grid * .12); gl_FragColor = vec4(color, 1.0); }`
    });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(720, 720), groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    city.add(ground);

    function seeded(seed) {
      const value = Math.sin(seed * 12.9898) * 43758.5453;
      return value - Math.floor(value);
    }

    function addBox(parent, size, position, material, cast = false) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(size.x, size.y, size.z), material);
      mesh.position.copy(position);
      mesh.castShadow = cast;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function createRoads() {
      const cityHalf = 172;
      const roadStep = 48;
      for (let i = -3; i <= 3; i++) {
        const lane = i * roadStep;
        addBox(city, new THREE.Vector3(cityHalf * 2, .08, 13), new THREE.Vector3(0, .045, lane), palettes.road);
        addBox(city, new THREE.Vector3(13, .081, cityHalf * 2), new THREE.Vector3(lane, .046, 0), palettes.road);
        addBox(city, new THREE.Vector3(cityHalf * 2, .1, .45), new THREE.Vector3(0, .11, lane - 3), palettes.curb);
        addBox(city, new THREE.Vector3(.45, .1, cityHalf * 2), new THREE.Vector3(lane + 3, .11, 0), palettes.curb);
        for (let mark = -3; mark <= 3; mark++) {
          const offset = mark * roadStep;
          addBox(city, new THREE.Vector3(7, .09, .18), new THREE.Vector3(offset, .1, lane), new THREE.MeshBasicMaterial({ color: 0xd5c886 }));
          addBox(city, new THREE.Vector3(.18, .09, 7), new THREE.Vector3(lane, .1, offset), new THREE.MeshBasicMaterial({ color: 0xd5c886 }));
        }
      }
    }

    function createWindows(x, y, z, width, height, depth, color) {
      const batch = color === 0x9ef0ff ? windowBatches.cool : windowBatches.warm;
      const rows = Math.min(7, Math.max(2, Math.floor(height / 5)));
      const columns = Math.min(4, Math.max(2, Math.floor(width / 4)));
      for (let row = 0; row < rows; row++) {
        for (let column = 0; column < columns; column++) {
          if ((row + column * 3 + Math.floor(x)) % 5 === 0 || batch.count >= 6000) continue;
          windowDummy.position.set(x - width / 2 + 2.1 + column * 4, y - height / 2 + 3 + row * 5, z + depth / 2 + .012);
          windowDummy.rotation.set(0, 0, 0);
          windowDummy.updateMatrix();
          batch.setMatrixAt(batch.count++, windowDummy.matrix);
        }
      }
      batch.instanceMatrix.needsUpdate = true;
    }

    function createBuilding(x, z, width, depth, height, seed) {
      const color = new THREE.MeshStandardMaterial({ color: palettes.building[Math.floor(seeded(seed) * palettes.building.length)], roughness: .82, metalness: .08 });
      const building = addBox(city, new THREE.Vector3(width, height, depth), new THREE.Vector3(x, height / 2, z), color);
      const roof = addBox(city, new THREE.Vector3(width * .82, .8, depth * .82), new THREE.Vector3(x, height + .4, z), new THREE.MeshStandardMaterial({ color: 0x202b37, roughness: 1 }));
      roof.rotation.y = seeded(seed + 2) * .3;
      createWindows(x, height / 2, z, width, height, depth, seeded(seed + 4) > .55 ? 0x9ef0ff : 0xffbf6b);
      colliders.push({ x, z, halfX: width / 2 + 1.2, halfZ: depth / 2 + 1.2 });
      return building;
    }

    function createTree(x, z, seed) {
      const group = new THREE.Group();
      const trunkHeight = 2.2 + seeded(seed) * 1.2;
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.28, .42, trunkHeight, 6), palettes.trunk);
      trunk.position.y = trunkHeight / 2;
      trunk.castShadow = true;
      group.add(trunk);
      const canopy = new THREE.Mesh(new THREE.IcosahedronGeometry(2.2 + seeded(seed + 1) * 1.2, 1), palettes.tree);
      canopy.position.y = trunkHeight + 1.2;
      canopy.castShadow = true;
      group.add(canopy);
      group.position.set(x, 0, z);
      city.add(group);
    }

    function createLamp(x, z, rotation = 0) {
      const group = new THREE.Group();
      const post = new THREE.Mesh(new THREE.CylinderGeometry(.1, .15, 5.4, 6), new THREE.MeshStandardMaterial({ color: 0x18242e, metalness: .7, roughness: .3 }));
      post.position.y = 2.7;
      group.add(post);
      const arm = addBox(group, new THREE.Vector3(1.3, .12, .12), new THREE.Vector3(.55, 5.28, 0), new THREE.MeshStandardMaterial({ color: 0x1c2d36, metalness: .6 }), true);
      arm.rotation.y = rotation;
      const bulb = new THREE.Mesh(new THREE.SphereGeometry(.23, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffd38c, toneMapped: false }));
      bulb.position.set(1.1, 5.05, 0);
      group.add(bulb);
      const light = lamps.length < 8 ? new THREE.PointLight(0xffa964, 1.4, 13, 2) : null;
      if (light) {
        light.position.set(1.1, 5, 0);
        group.add(light);
      }
      group.position.set(x, 0, z);
      city.add(group);
      if (light) lamps.push(light);
    }

    function createCity() {
      createRoads();
      let blockSeed = 7;
      for (let bx = -3; bx < 3; bx++) {
        for (let bz = -3; bz < 3; bz++) {
          const centerX = (bx + .5) * 48;
          const centerZ = (bz + .5) * 48;
          const count = 2 + Math.floor(seeded(blockSeed++) * 3);
          for (let index = 0; index < count; index++) {
            const width = 9 + seeded(blockSeed++) * 10;
            const depth = 9 + seeded(blockSeed++) * 10;
            const height = 11 + seeded(blockSeed++) * 33;
            const x = centerX + (seeded(blockSeed++) - .5) * 25;
            const z = centerZ + (seeded(blockSeed++) - .5) * 25;
            createBuilding(x, z, width, depth, height, blockSeed++);
          }
          if (seeded(blockSeed++) > .24) createTree(centerX - 14, centerZ + 13, blockSeed++);
          if (seeded(blockSeed++) > .55) createTree(centerX + 14, centerZ - 13, blockSeed++);
        }
      }
      for (let i = -3; i <= 3; i++) {
        createLamp(i * 48 - 7, -15, 0);
        createLamp(i * 48 + 7, 15, Math.PI);
        createLamp(-15, i * 48 - 7, Math.PI / 2);
        createLamp(15, i * 48 + 7, -Math.PI / 2);
      }
    }

    function makeCar() {
      const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0xd44955, roughness: .28, metalness: .55 });
      const darkMaterial = new THREE.MeshStandardMaterial({ color: 0x0b1118, roughness: .16, metalness: .7 });
      const glassMaterial = new THREE.MeshPhysicalMaterial({ color: 0x123646, roughness: .1, metalness: .25, transmission: .15, transparent: true, opacity: .88 });
      const headlightMaterial = new THREE.MeshBasicMaterial({ color: 0xbfefff, toneMapped: false });
      const tailMaterial = new THREE.MeshBasicMaterial({ color: 0xff392f, toneMapped: false });
      const body = addBox(car, new THREE.Vector3(3.3, .78, 6.1), new THREE.Vector3(0, 1.12, 0), bodyMaterial, true);
      body.geometry.translate(0, 0, 0);
      const hood = addBox(car, new THREE.Vector3(2.95, .22, 1.6), new THREE.Vector3(0, 1.62, 2.02), bodyMaterial, true);
      hood.rotation.x = -.06;
      const cabin = addBox(car, new THREE.Vector3(2.65, 1.08, 2.55), new THREE.Vector3(0, 1.73, -.48), darkMaterial, true);
      cabin.rotation.x = -.04;
      const windshield = addBox(car, new THREE.Vector3(2.34, .72, .08), new THREE.Vector3(0, 1.83, .85), glassMaterial);
      windshield.rotation.x = -.12;
      const rearGlass = addBox(car, new THREE.Vector3(2.34, .72, .08), new THREE.Vector3(0, 1.83, -1.81), glassMaterial);
      rearGlass.rotation.x = .12;
      const frontLight = addBox(car, new THREE.Vector3(.55, .18, .08), new THREE.Vector3(-1.08, 1.3, 3.06), headlightMaterial);
      const frontLight2 = frontLight.clone();
      frontLight2.position.x = 1.08;
      car.add(frontLight2);
      const rearLight = addBox(car, new THREE.Vector3(.62, .18, .08), new THREE.Vector3(-1.05, 1.27, -3.06), tailMaterial);
      const rearLight2 = rearLight.clone();
      rearLight2.position.x = 1.05;
      car.add(rearLight2);
      const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x111318, roughness: .8, metalness: .15 });
      const hubMaterial = new THREE.MeshStandardMaterial({ color: 0x99a8b0, roughness: .35, metalness: .7 });
      for (const x of [-1.62, 1.62]) {
        for (const z of [-2.02, 2.02]) {
          const wheel = new THREE.Mesh(new THREE.CylinderGeometry(.62, .62, .42, 14), wheelMaterial);
          wheel.rotation.z = Math.PI / 2;
          wheel.position.set(x, .62, z);
          wheel.castShadow = true;
          car.add(wheel);
          const hub = new THREE.Mesh(new THREE.CylinderGeometry(.25, .25, .44, 10), hubMaterial);
          hub.rotation.z = Math.PI / 2;
          hub.position.copy(wheel.position);
          car.add(hub);
        }
      }
      const glow = new THREE.PointLight(0xff472f, 0, 8, 2);
      glow.position.set(0, 1.2, -3.1);
      car.add(glow);
      car.userData.tailGlow = glow;
      car.scale.setScalar(.92);
    }

    function isBlocked(position) {
      if (Math.abs(position.x) > 350 || Math.abs(position.z) > 350) return true;
      for (const collider of colliders) {
        if (Math.abs(position.x - collider.x) < collider.halfX && Math.abs(position.z - collider.z) < collider.halfZ) return true;
      }
      return false;
    }

    function readInput() {
      let throttle = input.throttle;
      let brake = input.brake;
      let steer = input.steer;
      if (keys.has("w") || keys.has("arrowup")) throttle = 1;
      if (keys.has("s") || keys.has("arrowdown")) brake = 1;
      if (keys.has("a") || keys.has("arrowleft")) steer = -1;
      if (keys.has("d") || keys.has("arrowright")) steer = 1;
      return { throttle, brake, steer };
    }

    function updateVehicle(dt) {
      const controls = readInput();
      const wasMoving = Math.abs(state.speed) > .5;
      const direction = state.speed >= 0 ? 1 : -1;
      const driveForce = controls.throttle * 26;
      const reverseForce = controls.brake * (state.speed > 0 ? -44 : 18);
      const rollingResistance = state.speed * 1.55;
      state.speed += (driveForce + reverseForce - rollingResistance) * dt;
      if (!controls.throttle && !controls.brake) state.speed *= Math.pow(.13, dt);
      state.speed = THREE.MathUtils.clamp(state.speed, -12, 38);
      const speedRatio = THREE.MathUtils.clamp(Math.abs(state.speed) / 15, 0, 1);
      const steerResponse = (0.65 + speedRatio * 1.7) * direction;
      state.heading += controls.steer * steerResponse * dt * (Math.abs(state.speed) > .25 ? 1 : 0);
      const forward = new THREE.Vector3(Math.sin(state.heading), 0, Math.cos(state.heading));
      const next = carPosition.clone().addScaledVector(forward, state.speed * dt);
      if (isBlocked(next)) {
        if (wasMoving && state.impactTimer <= 0) {
          state.health = Math.max(0, state.health - 4);
          state.impactTimer = .45;
          damageReadout.style.opacity = "1";
        }
        state.speed *= -.18;
      } else {
        carPosition.copy(next);
      }
      state.impactTimer -= dt;
      if (state.impactTimer <= 0) damageReadout.style.opacity = "0";
      car.position.copy(carPosition);
      car.rotation.y = state.heading;
      car.rotation.z = -controls.steer * speedRatio * .035;
      car.userData.tailGlow.intensity = controls.brake ? 1.6 : 0;
      speedReadout.innerHTML = `${String(Math.round(Math.abs(state.speed) * 3.6)).padStart(3, "0")} <small>KM/H</small>`;
      statusReadout.textContent = state.health > 70 ? "cruise ready" : state.health > 35 ? "bodywork damaged" : "critical damage";
    }

    function updateCamera(dt) {
      const forward = new THREE.Vector3(Math.sin(state.heading), 0, Math.cos(state.heading));
      cameraTarget.copy(carPosition).add(new THREE.Vector3(0, 1.55, 0));
      cameraPosition.copy(carPosition).addScaledVector(forward, -11.5).add(new THREE.Vector3(0, 6.6, 0));
      const smoothing = 1 - Math.pow(.0008, dt);
      camera.position.lerp(cameraPosition, smoothing);
      camera.lookAt(cameraTarget);
    }

    function updateLighting(dt) {
      state.elapsed += dt;
      skyMaterial.uniforms.uTime.value = state.elapsed;
      const day = state.elapsed * .025;
      sun.position.set(Math.cos(day) * 150, 125 + Math.sin(day) * 50, Math.sin(day) * 150);
      sun.intensity = .95 + Math.max(0, Math.sin(day)) * .9;
      for (let i = 0; i < lamps.length; i++) lamps[i].intensity = .8 + Math.sin(state.elapsed * 1.2 + i) * .15;
    }

    function setDriveButton(button, field) {
      const set = (active) => {
        input[field] = active ? 1 : 0;
        button.classList.toggle("active", active);
      };
      button.addEventListener("pointerdown", (event) => { event.preventDefault(); button.setPointerCapture(event.pointerId); set(true); });
      button.addEventListener("pointerup", () => set(false));
      button.addEventListener("pointercancel", () => set(false));
      button.addEventListener("pointerleave", (event) => { if (event.buttons === 0) set(false); });
    }

    let joystickPointer = null;
    function updateJoystick(event) {
      const rect = joystickZone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const radius = rect.width * .36;
      const dx = event.clientX - centerX;
      const dy = event.clientY - centerY;
      const distance = Math.min(Math.hypot(dx, dy), radius);
      const angle = Math.atan2(dy, dx);
      const x = Math.cos(angle) * distance;
      const y = Math.sin(angle) * distance;
      joystickKnob.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
      input.steer = THREE.MathUtils.clamp(x / radius, -1, 1);
    }
    joystickZone.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      joystickPointer = event.pointerId;
      joystickZone.setPointerCapture(joystickPointer);
      updateJoystick(event);
    });
    joystickZone.addEventListener("pointermove", (event) => { if (event.pointerId === joystickPointer) updateJoystick(event); });
    function resetJoystick(event) {
      if (event.pointerId !== joystickPointer) return;
      joystickPointer = null;
      input.steer = 0;
      joystickKnob.style.transform = "translate(-50%, -50%)";
    }
    joystickZone.addEventListener("pointerup", resetJoystick);
    joystickZone.addEventListener("pointercancel", resetJoystick);
    setDriveButton(gasButton, "throttle");
    setDriveButton(brakeButton, "brake");

    addEventListener("keydown", (event) => keys.add(event.key.toLowerCase()));
    addEventListener("keyup", (event) => keys.delete(event.key.toLowerCase()));
    addEventListener("blur", () => { keys.clear(); input.throttle = 0; input.brake = 0; input.steer = 0; });
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
      renderer.setSize(innerWidth, innerHeight, false);
    });

    createCity();
    makeCar();
    camera.position.set(0, 7, -12);
    camera.lookAt(0, 1, 0);

    function animate() {
      window.__frameCount = (window.__frameCount || 0) + 1;
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), .05);
      updateVehicle(dt);
      updateCamera(dt);
      updateLighting(dt);
      renderer.render(scene, camera);
    }
    animate();
    window.__neonDistrictReady = true;
  </script>
</body>
</html>
